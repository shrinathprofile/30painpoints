<!doctype html>
<!-- Measurement instrument for real-run validation: prints its own layout width,
     and paints a ruler (a labeled band every 500px) so scroll-sync is visible. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>demo — viewport-wall instrument page</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
        color: #111;
      }
      #badge {
        position: sticky;
        top: 0;
        padding: 12px;
        background: #4f8cff;
        color: #fff;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .band {
        height: 500px;
        border-bottom: 2px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        font-weight: 800;
        color: rgba(0, 0, 0, 0.25);
      }
      .band:nth-child(odd) {
        background: #f4f6fa;
      }
      .band:nth-child(even) {
        background: #e6eaf2;
      }
    </style>
  </head>
  <body>
    <div id="badge"></div>
    <script>
      const badge = document.getElementById("badge");
      const show = () => {
        badge.textContent = `layout width: ${document.documentElement.clientWidth}px`;
      };
      show();
      window.addEventListener("resize", show);
      // 12 bands = 6,000px of scrollable ruler.
      for (let y = 0; y <= 5500; y += 500) {
        const b = document.createElement("div");
        b.className = "band";
        b.textContent = y;
        document.body.append(b);
      }
    </script>
  </body>
</html>
